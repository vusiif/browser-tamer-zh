name: 'Build'

env:
  BUILD_TYPE: Release
  VCPKG_HASH: d92484ed3c5020c6679d095ad3e5add907887b62

on:
  # Automatic triggers are paused: only manual runs (Actions tab -> Build -> Run workflow).
  # To re-enable, restore:
  #   push:
  #     branches: [master]
  #     tags: ['v*']        # release when pushing a version tag, e.g. v6.3.4-zh.1
  #   pull_request:
  #     branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This fork only ships Windows x64. Upstream also builds Windows ARM64
        # (arm64-windows-static), Linux (x64-linux, *.deb) and macOS (arm64-osx / x64-osx, *.dmg).
        include:
          - os: windows-latest
            name: Windows x64
            vcpkg_triplet: x64-windows-static
            vcpkg_config: Release
            artifact_suffix: -win-x64
            artifact_pattern: '*.msi'

    name: 'build: ${{ matrix.name }}'
    env:
      VCPKG_DEFAULT_VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}

    steps:

    - name: 🪟 Dependencies
      run: |
        dotnet tool install --global wix
        wix eula accept wix7
        wix extension add --global WixToolset.UI.wixext

    - uses: actions/checkout@v6

    - name: Create variables
      run: |
        $VERSION = (Get-Content docs/release-notes.md -Head 1).Trim() -replace '[ #]', ''
        Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION"
        Write-Host "VERSION: ${{ env.VERSION }}"
      shell: pwsh

    - uses: friendlyanon/setup-vcpkg@v1
      # seems like the absense of commit hash expects vcpkg submodule, i don't want that
      with:
        committish: ${{ env.VCPKG_HASH }}
        # set it to false to clear any cache in case of build errors
        cache: false

    # Source archives vcpkg downloads (not build outputs), so a flaky upstream site
    # only has to work once per vcpkg baseline.
    - name: 💾 cache vcpkg downloads
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DOWNLOADS || format('{0}/downloads', env.VCPKG_ROOT) }}
        key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_HASH }}

    # www.lua.org often fails from GitHub runners (timeouts, SSL connect error 35), and vcpkg
    # gives up on it. Pre-seed vcpkg's download cache: try our backup copy (release "deps"),
    # then the official site, and accept a file only if its SHA512 matches the vcpkg port.
    # When the vcpkg baseline moves to another Lua version, update FILE/SHA512 below (and the
    # "deps" release); until then this step is harmless and vcpkg downloads the new version itself.
    - name: 🌙 prefetch Lua source
      shell: pwsh
      env:
        FILE: lua-5.5.0.tar.gz
        SHA512: 3253d2cdc929da6438095a30d66ef16a1abdbb0ada8fee238705b3b38492f14be9553640fdca6b25661e01155ba5582032e0a2ef064e4c283e85efc0a128cabe
      run: |
        # same directory vcpkg itself uses
        $dir = if ($env:VCPKG_DOWNLOADS) { $env:VCPKG_DOWNLOADS } else { Join-Path $env:VCPKG_ROOT 'downloads' }
        $dest = Join-Path $dir $env:FILE
        New-Item -ItemType Directory -Force $dir | Out-Null
        function Test-Archive($path) {
          (Test-Path $path) -and ((Get-FileHash $path -Algorithm SHA512).Hash.ToLower() -eq $env:SHA512)
        }
        if (Test-Archive $dest) { Write-Host "already cached: $dest"; exit 0 }
        $urls = @(
          "https://github.com/${{ github.repository }}/releases/download/deps/$env:FILE",
          "https://www.lua.org/ftp/$env:FILE"
        )
        foreach ($url in $urls) {
          $tmp = "$dest.tmp"
          curl.exe -fsSL --retry 3 --retry-all-errors --retry-delay 10 --max-time 120 -o $tmp $url
          if ($LASTEXITCODE -eq 0 -and (Test-Archive $tmp)) {
            Move-Item -Force $tmp $dest
            Write-Host "fetched $env:FILE from $url"
            exit 0
          }
          Write-Host "::warning::could not get a valid $env:FILE from $url"
          Remove-Item -Force -ErrorAction SilentlyContinue $tmp
        }
        Write-Host "::error::no source provided a valid $env:FILE"
        exit 1

    - name: ⚙️ configure
      run: >
        cmake -B build -S .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D "CMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
        -D "VCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}"
        -D "CPACK_PACKAGE_VERSION=${{ env.VERSION }}"
      working-directory: .

    - name: 🏭 build
      run: cmake --build build --config ${{ matrix.vcpkg_config }}
      working-directory: .

#    - name: debug
#      run: ls -R
#      working-directory: build/bt

    - name: 🧪 unit tests
      run: |
          ctest --test-dir build -C ${{ matrix.vcpkg_config }} --output-on-failure
      working-directory: .

    - name: 📦 Package Installer
      run: |
        cpack -C ${{ matrix.vcpkg_config }}
      working-directory: build

    - name: 📋 Dump WiX log on failure
      if: failure()
      shell: pwsh
      run: |
        $log = "build/_CPack_Packages/win64/WIX/wix.log"
        if (Test-Path $log) { Get-Content $log }

    - name: prep artifacts
      run: |
        mkdir atf
        cp build/${{ matrix.artifact_pattern }} atf/
        echo -n "${{ env.VERSION }}" > atf/version.txt
        cp docs/release-notes.md atf/

    - uses: actions/upload-artifact@v7
      name: collect binaries
      with:
        name: bin${{ matrix.artifact_suffix }}
        path: atf/*
        if-no-files-found: error
        compression-level: 9

  release-artifacts:
    runs-on: ubuntu-latest
    name: '📦 Prepare Release Artifacts'
    needs: [build]
    steps:
      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true  # overwrites duplicate files

      - name: debug
        run: ls -R

      - uses: actions/upload-artifact@v7
        name: ⬆️ Upload as a single artifact
        with:
          name: bin-all
          path: '*'
          if-no-files-found: error
          compression-level: 9

  github-release:
    runs-on: ubuntu-latest
    name: '🚀 GitHub Release'
    needs: [release-artifacts]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    environment:
      name: release

    steps:

      - name: ⬇️ Download binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-all

      - name: 🔍 view artifacts to be used
        run: ls -R
        working-directory: .

      - name: 🔢 set version environment variable
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(cat version.txt | xargs)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # this fork's releases are tagged separately from upstream's plain "x.y.z" versions:
          # use the pushed tag (e.g. v6.3.4-zh.1), or v<upstream version>-zh for manual runs
          if [ "$REF_TYPE" = "tag" ]; then
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v$VERSION-zh" >> "$GITHUB_ENV"
          fi

      - name: 🔢 prep release notes / artifacts
        run: |
          {
            echo "Browser Tamer 中文版，基于上游 [aloneguid/bt](https://github.com/aloneguid/bt) ${VERSION}。"
            echo "本分支只做界面汉化，功能与上游一致；非汉化相关的问题请优先反馈到[原项目](https://github.com/aloneguid/bt/issues)。"
            echo
            echo "### 上游 ${VERSION} 更新说明"
            echo
            grep -m 2 -B 1000 '^## ' release-notes.md | tail -n +3 | head -n -2
          } > final_notes.md
          cat final_notes.md

      - name: 🔍 view artifacts to be used
        run: ls -R
        working-directory: .

      # https://github.com/softprops/action-gh-release
      - name: 📦 create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # the built-in token is enough: no other workflow needs to be triggered by the release
          # (upstream used a PAT here to trigger its WinGet workflow, which this fork does not have)
          token: ${{ github.token }}
          name: Browser Tamer 中文版 ${{ env.RELEASE_TAG }}
          files: |
            *.msi
          body_path: final_notes.md
