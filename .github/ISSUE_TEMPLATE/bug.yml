name: 汉化问题 / 中文版 Bug
description: 翻译错误、文字截断、中文显示异常，或只在中文版出现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本仓库只负责汉化。如果问题在[原版 Browser Tamer](https://github.com/aloneguid/bt/releases) 里也能复现，
        请直接到[原项目](https://github.com/aloneguid/bt/issues)用英文提交，那里修得更快。
  - type: input
    id: appversion
    attributes:
      label: 版本
      description: 中文版的版本号或 Release 标签。
      placeholder: 例如 v6.3.4-zh.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统与架构
      options:
        - Windows (64 位)
        - Windows (ARM64)
        - Linux (64 位)
        - macOS
        - 其他（请在下面说明）
    validations:
      required: true
  - type: dropdown
    id: original
    attributes:
      label: 原版英文界面是否也有这个问题？
      description: 可以在「常规 → 语言」里切换到 English 对比。
      options:
        - 只有中文界面有
        - 英文界面也有
        - 没试过
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: 问题描述与复现步骤
      description: 在哪个窗口、哪个位置，看到了什么，期望是什么。翻译问题请附上原文和建议的译文，有截图更好。
      value: "..."
    validations:
      required: true
